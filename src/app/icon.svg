<!--
  Tab icon — the same mark the header renders.

  The paths below are `src/components/layout/Wordmark.tsx` verbatim, with the
  two CSS custom properties resolved to the values `Logo.tsx` passes it:
  wordmark ink is `text-strong` (#ffffff), wordmark accent is `signal`
  (#ff6a00). The previous icon was the supplied light-background artwork —
  multi-colour letterforms on a white plate, which matched nothing on the site.

  A favicon file cannot read the app's custom properties, so the values are
  literal here. If the palette moves in globals.css, this has to move with it.

  The wordmark's own box is 196x112; the canvas is squared to 196x196 around
  it so browsers get a tile rather than a strip they letterbox themselves, and
  it carries the page ground (#0D0D0F) because a white wordmark is invisible
  against a light browser chrome.
-->
